[tools]
zig = "0.17.0"

[env]
ZIG_OPTIMIZE = "fast"

[tasks.build]
description = "Build the project"
run = "zig build -Doptimize=${ZIG_OPTIMIZE:-Debug}"

[tasks.run]
description = "Build and run the simulation"
run = "zig build run -Doptimize=${ZIG_OPTIMIZE:-Debug} --"

[tasks.test]
description = "Run the test suite"
run = "zig build test"

[tasks.fmt]
description = "Check formatting without writing changes"
run = "zig fmt --check --exclude zig-pkg ."

[tasks.fix]
description = "Auto format all source files"
run = "zig fmt --exclude zig-pkg ."

[tasks.check]
description = "Run everything CI runs"
depends = ["test", "fmt"]

[tasks.gif]
description = "Record the simulation with asciinema and render docs/assets/example.gif"
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
echo "Recording ${DURATION}s at ${SIZE} (skipping the first ${SKIP}s)..."
asciinema rec --headless --overwrite --idle-time-limit 0.1 \
  --window-size "$SIZE" \
  --command "zig-out/bin/gameoflife --headless --seed $SEED --duration $((DURATION + SKIP))" \
  "$tmp/example.cast"
# Drop the final output event, the exit teardown (clear + leave alt screen), so the last frame isn't blank.
# Then fast-forward through the first $SKIP seconds: output is incremental, so those events are kept
# but given zero delay, and the gif opens on the board as it stood at $SKIP seconds.
jq -c -s --argjson skip "$SKIP" '
  del(.[map(type == "array" and .[1] == "o") | rindex(true)])
  | .[0], foreach .[1:][] as $e (0; . + $e[0]; if . < $skip then [0] + $e[1:] else $e end)
' "$tmp/example.cast" > "$tmp/trimmed.cast"
agg --font-family "$FONT" --theme "$THEME" --font-size 14 --fps-cap 20 --last-frame-duration 0 \
  "$tmp/trimmed.cast" docs/assets/example.gif
echo "Wrote docs/assets/example.gif"
"""

[tasks.gif.tools]
"github:asciinema/asciinema" = "3.2.1"
"github:asciinema/agg" = "1.9.0"
jq = "1.8.2"

[tasks.gif.env]
DURATION = "15"
SKIP = "2"
SEED = "993"
SIZE = "200x40"
THEME = "asciinema"
FONT = "JetBrainsMono Nerd Font Mono"
